name: CI

# Zielversion ist Moodle 5.3 (LTS). 5.1 und 5.2 laufen als Absicherung mit,
# 5.3 als MOODLE_503_STABLE (seit dem 5. Oktober verzweigt; main ist 5.4dev).
#
# PHP: 8.3 ist die von Moodle 5.3 geforderte Mindestversion, 8.4 laeuft auf allen
# Zweigen mit. PHP 8.5 laesst sich derzeit nicht fahren - Moodles composer.lock
# haelt ezyang/htmlpurifier auf einer Fassung, die nur bis PHP 8.4 zugelassen ist,
# `composer install` bricht deshalb im Moodle-Baum ab. Bis der Kern nachzieht,
# prueft der Job "PHP 8.5" nur Syntax und Code-Style unseres eigenen Codes, und der
# Job "php85-canary" (#13) faehrt PHPUnit mit ausgesetzter PHP-Plattformpruefung,
# nicht blockierend: er ordnet jede Deprecation ihrer Herkunft zu und wird nur bei
# einer aus diesem Plugin rot. PHP 8.5 ist damit beobachtet, nicht unterstuetzt.
# Unterstuetzt: Moodle 5.1 mit PHP 8.2-8.4, Moodle 5.2/5.3 mit PHP 8.3-8.4.
#
# Datenbanken: Moodle 5.3 verlangt PostgreSQL >= 17 bzw. MariaDB >= 11.4.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.moodle-branch }} · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=3

      mariadb:
        image: mirror.gcr.io/library/mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_501_STABLE', 'MOODLE_502_STABLE', 'MOODLE_503_STABLE']
        php: ['8.3']
        database: ['pgsql', 'mariadb']
        include:
          # PHP 8.4 auf jedem Zweig, aber nur gegen PostgreSQL - die zweite Engine
          # deckt 8.3 bereits ab.
          # Moodle 5.1 laesst PHP 8.2 noch zu (admin/environment.xml) - die kleinste
          # unterstuetzte Kombination laeuft mit (#13).
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.2'
            database: 'pgsql'
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.4'
            database: 'pgsql'
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.4'
            database: 'pgsql'
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.4'
            database: 'pgsql'
          # Re-audit 19.11.2026 (CI P0): PHP 8.4 with MariaDB as well, on every line.
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.4'
            database: 'mariadb'
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.4'
            database: 'mariadb'
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.4'
            database: 'mariadb'

    steps:
      - name: Plugin auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap, intl, pcntl
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # Der Installer legt das Plugin im Moodle-Baum ab und schreibt den Zielpfad als
      # PLUGIN_DIR in ci/.env - nicht nach $GITHUB_ENV. Im Shell-Kontext des Workflows ist
      # die Variable also leer; moodle-plugin-ci liest sie beim Start selbst und setzt sie
      # als Vorgabe des Pluginarguments ein. Deshalb bekommen die Pruefschritte gar kein
      # Argument: nur so treffen sie den installierten Pfad, den der Mustache-Pruefer und
      # Grunt zwingend brauchen.
      - name: Moodle installieren
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP-Syntax
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      # PSR1.Classes.ClassDeclaration ist ausgenommen: mod_adaptivequiz_csv_renderer ist ein
      # Renderer-Subtyp und muss laut Moodles renderer_factory in renderer.php stehen.
      - name: Code-Style
        if: ${{ always() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration

      - name: PHPDoc
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache-Templates
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      # moodle-plugin-ci grunt copies the plugin to a backup and afterwards back over the plugin (override). git keeps
      # its pack files read-only, so copying back failed on every .git directory inside the plugin (run of 23.11.2026,
      # moodle-plugin-ci 4.5.12: "Failed to copy ... .git/objects/pack/... Permission denied"). Only the .git
      # directories get write permission; the plugin's own files stay as they are.
      - name: Make the .git directories of the plugin writable for grunt
        if: ${{ always() }}
        run: |
          MOODLE="${MOODLE_DIR:-$(pwd)/moodle}"
          for d in "$MOODLE/public/mod/adaptivequiz" "$MOODLE/mod/adaptivequiz"; do
            if [ -d "$d" ]; then find "$d" -name .git -type d -prune -exec chmod -R u+w {} +; fi
          done

      - name: Grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ always() }}
        env:
          # The concurrency tests (pcntl) fail instead of being skipped: a skip is no green (audit 18.10.).
          CATQUIZ_REQUIRE_CONCURRENCY: '1'
        # Re-audit 19.11.2026 (CI P0): the call moodle-plugin-ci makes - vendor/bin/phpunit with the testsuite of the
        # component, from the Moodle root - plus a JUnit log, which the evidence step below reads.
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cd moodle
          vendor/bin/phpunit --testsuite mod_adaptivequiz_testsuite --testdox --fail-on-warning \
            --log-junit "$GITHUB_WORKSPACE/ci-logs/junit.xml" 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/phpunit.log"

      # Re-audit 19.11.2026 (CI P0): which commits of engine, host and adapter ran together, on which Moodle, PHP
      # and database, how many tests and assertions, what was skipped - and the tests the issues name ran, passed
      # and were not skipped (the job fails otherwise). Also in the job summary.
      - name: Evidence (commits, versions, tests)
        if: ${{ always() }}
        env:
          CI_EVIDENCE_SELF: mod_adaptivequiz
        run: >-
          python3 plugin/.github/scripts/ci_evidence.py
          --title "PHPUnit / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
          --moodle moodle --db ${{ matrix.database }}
          --component mod_adaptivequiz=plugin
          --junit ci-logs/junit.xml --required plugin/.github/ci-required-tests.txt
          --out ci-logs/evidence

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-phpunit-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/evidence
            ci-logs/junit.xml
          retention-days: 90
          if-no-files-found: warn

      # Docker Hub begrenzt anonyme Pulls (toomanyrequests). moodle-plugin-ci startet Selenium
      # per docker run und holt das Image sonst von Docker Hub; liegt es lokal vor, wird nicht
      # gezogen. Deshalb zuerst ueber den Google-Mirror, erst danach Docker Hub, mit Wiederholung.
      - name: Selenium-Image vorladen (Docker-Hub-Ratenlimit)
        if: ${{ always() }}
        run: |
          for src in mirror.gcr.io/selenium/standalone-chrome:4 selenium/standalone-chrome:4; do
            for attempt in 1 2 3; do
              if docker pull "$src"; then
                docker tag "$src" selenium/standalone-chrome:4
                exit 0
              fi
              sleep $((attempt * 15))
            done
          done
          echo "::warning::Selenium-Image konnte nicht vorab geladen werden."

      # Behat ist scharf: der Lauf vom 9. September war auf allen Zweigen und beiden
      # Datenbanken gruen, 33 Szenarien mit 1569 Schritten.
      # Screenshots landen im faildump-Verzeichnis - bei Fehlschlaegen automatisch, im
      # Erfolgsfall an den Stellen, die ein Szenario ueber "I save a screenshot named" selbst
      # markiert. Beides wird hochgeladen: ein gruener Lauf ohne Bild zeigt niemandem, was das
      # Feature tatsaechlich erzeugt hat.
      - name: Behat
        if: ${{ always() }}
        env:
          # local_catquiz #176: every scenario of the run records itself here (tests/behat/behat_mod_adaptivequiz_evidence.php).
          ADAPTIVEQUIZ_BEHAT_EXECUTED: ${{ github.workspace }}/ci-logs/behat-executed.jsonl
        run: |
          set -o pipefail
          mkdir -p ci-logs
          moodle-plugin-ci behat --profile chrome 2>&1 | tee ci-logs/behat.log

      # local_catquiz #176: the evidence must fail for a required feature the run did not execute (RED/GREEN self-test).
      - name: Selbsttest der CI-Evidenz
        if: ${{ always() }}
        run: python3 -B plugin/.github/scripts/ci_evidence_selftest.py

      # Re-audit 19.11.2026 (CI P0): which commits of engine, host and adapter ran together, on which Moodle, PHP
      # and database, how many tests and assertions, what was skipped - and the tests the issues name ran, passed
      # and were not skipped (the job fails otherwise). Also in the job summary.
      - name: Evidence (commits, versions, Behat)
        if: ${{ always() }}
        env:
          CI_EVIDENCE_SELF: mod_adaptivequiz
        run: >-
          python3 plugin/.github/scripts/ci_evidence.py
          --title "Behat / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
          --moodle moodle --db ${{ matrix.database }}
          --component mod_adaptivequiz=plugin
          --behat-log ci-logs/behat.log --required-features plugin/.github/ci-required-features.txt
          --features-dir plugin/tests/behat --tag @mod_adaptivequiz
          --behat-executed ci-logs/behat-executed.jsonl
          --out ci-logs/evidence-behat

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-behat-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/evidence-behat
            ci-logs/behat.log
            ci-logs/behat-executed.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Behat-Screenshots sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: |
            moodledata_behat_faildump/**
            moodledata/behat_faildump/**
          if-no-files-found: ignore
          retention-days: 14

  php85:
    name: PHP 8.5 · Syntax und Code-Style
    runs-on: ubuntu-latest

    # Moodle 5.x laesst sich unter PHP 8.5 nicht installieren: composer.lock haelt
    # ezyang/htmlpurifier auf einer Fassung, die nur bis 8.4 zugelassen ist. Was sich
    # ohne Moodle-Baum pruefen laesst, wird hier trotzdem gegen 8.5 gefahren - damit
    # unser eigener Code nicht unbemerkt auf 8.5 zerfaellt.
    steps:
      - name: Plugin auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH

      - name: PHP-Syntax
        run: moodle-plugin-ci phplint ./plugin

      - name: Code-Style
        run: moodle-plugin-ci phpcs --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration ./plugin

  php85-canary:
    # Issue #13: Vorwaertskompatibilitaet, nicht Unterstuetzung. Moodle 5.1-5.3 unterstuetzen
    # PHP 8.5 nicht; der Job blockiert deshalb nichts. Er faehrt PHPUnit dieses Plugins unter
    # 8.5, sammelt jede Deprecation mit Datei und ordnet sie ihrer Herkunft zu. Rot wird er nur,
    # wenn eine aus mod_adaptivequiz selbst stammt (PLUGIN) - Kernmeldungen sind sichtbar, aber
    # kein Fehler dieses Plugins. Nichts wird unterdrueckt, kein Kern-Code wird angefasst.
    name: PHP 8.5 · Canary (nicht unterstuetzt, nicht blockierend)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=3

    env:
      DEPRECATION_LOG: ${{ github.workspace }}/php-deprecations.log

    steps:
      - name: Plugin auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP 8.5 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, zip, gd, soap, intl
          ini-values: >-
            max_input_vars=5000, error_reporting=E_ALL, log_errors=On, display_errors=stderr,
            error_log=${{ github.workspace }}/php-deprecations.log
          coverage: none

      - name: Selbsttest der Einordnung
        run: python3 plugin/tools/test_classify_deprecations.py

      # Der Zweig bewegt sich; ohne den Commit waere ein Befund nicht nachstellbar. Die SHA geht
      # in die Zusammenfassung und das JSON des Classifiers (#13).
      - name: Moodle 5.3 holen und das Plugin einhaengen
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch MOODLE_503_STABLE https://github.com/moodle/moodle.git moodle
          sha=$(git -C moodle rev-parse HEAD)
          echo "Moodle MOODLE_503_STABLE @ $sha"
          echo "MOODLE_SHA=$sha" >> "$GITHUB_ENV"
          echo "PHP_VERSION=$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_ENV"
          cp -r plugin moodle/public/mod/adaptivequiz
          rm -rf moodle/public/mod/adaptivequiz/.git

      # composer.lock haelt ezyang/htmlpurifier auf einer Fassung bis PHP 8.4. Die Plattformpruefung
      # wird nur fuer PHP ausgesetzt - das ist genau die nicht unterstuetzte Kombination, die hier
      # beobachtet werden soll.
      - name: Composer (PHP-Plattformpruefung ausgesetzt)
        working-directory: moodle
        run: composer install --no-interaction --no-progress --ignore-platform-req=php

      # Moodles PHPUnit-Bootstrap verlangt en_AU.UTF-8; das Runner-Image bringt die Locale nicht mit.
      # Ohne diesen Schritt brach das Init am 28.10.2026 mit "Required locale 'en_AU.UTF-8' is not
      # installed" ab - die Canary hatte nie getestet. Die Matrix-Jobs oben tun dasselbe.
      - name: Locale en_AU.UTF-8
        run: sudo locale-gen en_AU.UTF-8

      - name: config.php
        working-directory: moodle
        run: |
          mkdir -p "$RUNNER_TEMP/moodledata" "$RUNNER_TEMP/phpu_moodledata"
          cat > config.php <<CFG
          <?php
          unset(\$CFG);
          global \$CFG;
          \$CFG = new stdClass();
          \$CFG->dbtype = 'pgsql';
          \$CFG->dblibrary = 'native';
          \$CFG->dbhost = '127.0.0.1';
          \$CFG->dbname = 'postgres';
          \$CFG->dbuser = 'postgres';
          \$CFG->dbpass = '';
          \$CFG->dboptions = [];
          \$CFG->prefix = 'm_';
          \$CFG->wwwroot = 'http://localhost';
          \$CFG->dataroot = '$RUNNER_TEMP/moodledata';
          \$CFG->phpunit_prefix = 'phpu_';
          \$CFG->phpunit_dataroot = '$RUNNER_TEMP/phpu_moodledata';
          \$CFG->directorypermissions = 02777;
          require_once(__DIR__ . '/lib/setup.php');
          CFG

      # Frueher verschluckte "| tail -n 5" ohne pipefail den Exit-Code von init.php: ein
      # gescheitertes Init lief weiter, PHPUnit fand keine Tests, der Classifier sah keine
      # PLUGIN-Meldung - die Canary war gruen, ohne getestet zu haben (#13). Jetzt bricht der
      # Schritt ab und zeigt das Ende des vollstaendigen Protokolls.
      - name: PHPUnit vorbereiten
        working-directory: moodle
        shell: bash
        run: |
          set -o pipefail
          if ! php public/admin/tool/phpunit/cli/init.php --no-composer-self-update > "$GITHUB_WORKSPACE/phpunit-init.log" 2>&1; then
            tail -n 50 "$GITHUB_WORKSPACE/phpunit-init.log"
            echo "::error::PHPUnit-Init unter PHP 8.5 gescheitert - Canary nicht beurteilbar."
            exit 1
          fi
          tail -n 5 "$GITHUB_WORKSPACE/phpunit-init.log"

      # Das Ergebnis der Tests ist hier nicht der Massstab, die Deprecations sind es. Der
      # Exit-Code von PHPUnit (nicht der von tee) wird festgehalten: 0/1 sind ein Lauf mit
      # bestandenen bzw. fehlgeschlagenen Tests, alles andere ein Abbruch, den der Classifier
      # als Infrastrukturfehler (Exit 3) meldet.
      - name: PHPUnit mod_adaptivequiz unter PHP 8.5
        working-directory: moodle
        shell: bash
        run: |
          set +e -o pipefail
          vendor/bin/phpunit --testsuite mod_adaptivequiz_testsuite --display-deprecations \
            2>&1 | tee "$GITHUB_WORKSPACE/phpunit-php85.log"
          echo "PHPUNIT_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      # Exit 1 = Deprecation aus diesem Plugin (Gate), Exit 3 = Lauf nicht beurteilbar (Init,
      # PHPUnit oder Moodle-Baum fehlen) - beides rot, aber in der Zusammenfassung getrennt:
      # "Gate: PLUGIN=n -> FAIL/PASS; Infrastruktur: OK/FEHLER".
      - name: Deprecations nach Herkunft einordnen (Gate - PLUGIN)
        if: ${{ always() }}
        shell: bash
        run: |
          touch "$DEPRECATION_LOG" phpunit-php85.log
          cat "$DEPRECATION_LOG" phpunit-php85.log > all-output.log
          set +e
          python3 plugin/tools/classify_deprecations.py all-output.log moodle deprecations --expect-phpunit
          status=$?
          set -e
          {
            echo "## PHP 8.5 Canary - nicht unterstuetzt, Vorwaertskompatibilitaet"
            cat deprecations/deprecations-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Deprecation-Protokolle sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: php85-canary-deprecations
          path: |
            php-deprecations.log
            phpunit-init.log
            phpunit-php85.log
            deprecations/**
          if-no-files-found: warn
          retention-days: 14

  classifier:
    name: Selbsttest des Deprecation-Classifiers
    runs-on: ubuntu-latest
    steps:
      - name: Plugin auschecken
        uses: actions/checkout@v4

      # Die Canary (#13) ist nicht blockierend - ihr Classifier aber schon: ein Fehler in der
      # Einordnung wuerde die Canary still gruen oder grundlos rot machen. Deshalb laeuft sein
      # Selbsttest hier, in einem Job, der den Workflow rot macht.
      - name: Selbsttest des Deprecation-Classifiers (#13)
        run: python3 tools/test_classify_deprecations.py
