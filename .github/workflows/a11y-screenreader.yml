name: Accessibility Screenreader

# Screen reader tests of mod_adaptivequiz with a real NVDA, entirely inside GitHub Actions.
# Built like the a11y-screenreader.yml of local_adele (and local_stackmatheditor's a11y-nvda.yml).
#
# MANUAL ONLY: Actions tab -> "Accessibility Screenreader" -> "Run workflow".
# No push trigger and no schedule. Nothing to type in: no site address, no account, no secret -
# the site is built and seeded inside the run.
#
# Two facts make this a two-job workflow. NVDA exists only on Windows. The test site is built on
# Linux, exactly as a11y-axe.yml builds it (PostgreSQL as a service container, which Windows runners
# do not offer). So:
#
#   site  (ubuntu)   installs Moodle with this plugin, runs tests/a11y/seed_stop_notice.php, serves
#                    the site, opens a temporary public tunnel to it, hands the address and the seed
#                    values to the Windows job as an artefact, and stays up until that job is done
#   nvda  (windows)  waits for that artefact, then runs tests/a11y/screenreader against the tunnel
#                    with NVDA listening
#
# The site is a throwaway built for this run; its participant, its password and the tunnel address
# end with the run.
#
# EVERY run uploads ONE artefact, whatever the outcome - passed, failed or cancelled: HTML report,
# video of every test, the spoken phrase log as a plain transcript, results.json, junit.xml and the
# console output. For this suite the recording of a PASSING run is the point: it is what lets a
# sighted reviewer follow what a blind user would have heard.
#
# NOTE: workflow_dispatch only appears in the Actions UI once this file is on the repository's
# DEFAULT branch. The run itself uses this file from the branch chosen in the form.
"on":
  workflow_dispatch:
    inputs:
      grep:
        description: >-
          Only run tests whose title matches this regular expression, e.g. A11Y-AQ-SR-01.
          Empty: the whole suite.
        type: string
        default: ''
      retention_days:
        description: Days the result artefact is kept.
        type: number
        default: 30

concurrency:
  group: a11y-screenreader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The two jobs talk through artefacts of this run, read with the API.
  actions: read

jobs:
  site:
    name: Test site behind a tunnel (MOODLE_405_STABLE)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
          coverage: none

      - name: Check out Moodle and put the plugin in
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle
          webroot=moodle
          [ -d moodle/public ] && webroot=moodle/public
          cp -a plugin "$webroot/mod/adaptivequiz"
          rm -rf "$webroot/mod/adaptivequiz/.git"
          echo "MOODLE_WEBROOT=$GITHUB_WORKSPACE/$webroot" >> "$GITHUB_ENV"
          echo "mod_adaptivequiz (under test): $GITHUB_REPOSITORY $GITHUB_REF_NAME $GITHUB_SHA"
          # The seed builds its questions with the helpers of the question tests, which need PHPUnit.
          (cd moodle && composer install --no-interaction --no-progress --prefer-dist)

      # install.php writes config.php itself and needs a writable dataroot outside the tree.
      - name: Install Moodle
        run: |
          mkdir -p "$RUNNER_TEMP/moodledata"
          cd moodle
          php admin/cli/install.php --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot="$RUNNER_TEMP/moodledata" \
            --fullname="A11y NVDA" --shortname="A11yNVDA" --adminpass="Admin!23" --adminemail=ci@example.invalid

      - name: Seed the stop notice fixture
        run: |
          php plugin/tests/a11y/seed_stop_notice.php --moodle="$GITHUB_WORKSPACE/moodle" > "$RUNNER_TEMP/seed.env"
          password=$(sed -n 's/^A11Y_PASSWORD=//p' "$RUNNER_TEMP/seed.env")
          [ -n "$password" ] && echo "::add-mask::$password"
          for key in A11Y_USER A11Y_PASSWORD A11Y_ACTIVITY_URL; do
            grep -q "^$key=." "$RUNNER_TEMP/seed.env" \
              || { echo "::error::the seed printed no $key"; cat "$RUNNER_TEMP/seed.env"; exit 1; }
          done
          sed 's/^A11Y_PASSWORD=.*/A11Y_PASSWORD=***/' "$RUNNER_TEMP/seed.env"

      - name: Serve the site and open a tunnel to it
        run: |
          curl -sSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"

          # Server and tunnel have to outlive this step - the site stays up while the Windows job
          # runs. setsid gives them a session of their own, nohup ignores the hang-up. One worker
          # stalls as soon as a page pulls its subresources in parallel.
          PHP_CLI_SERVER_WORKERS=8 setsid nohup php -S 127.0.0.1:8000 -t "$MOODLE_WEBROOT" \
            > "$RUNNER_TEMP/moodle-server.log" 2>&1 < /dev/null &
          code=000
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8000/login/index.php || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "Local server: HTTP $code"
          [ "$code" = "200" ] || { tail -40 "$RUNNER_TEMP/moodle-server.log"; exit 1; }

          setsid nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8000 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 < /dev/null &

          url=''
          for _ in $(seq 1 60); do
            # || true: while the tunnel is still starting grep finds nothing, and with -e and
            # pipefail that would end the step at once.
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" \
              2>/dev/null | head -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          if [ -z "$url" ]; then
            echo "::error::The tunnel did not come up."; tail -40 "$RUNNER_TEMP/cloudflared.log"; exit 1
          fi
          echo "Tunnel: $url"

          # Moodle redirects every request to wwwroot, so it has to be the address the Windows
          # runner uses. The tunnel terminates TLS and PHP sees plain HTTP: sslproxy says so.
          # config.php sits in the Moodle root on every line, also where the web root is public/.
          cfg="$GITHUB_WORKSPACE/moodle/config.php"
          sed -i "s#^\$CFG->wwwroot *=.*#\$CFG->wwwroot = '$url';\n\$CFG->sslproxy = true;#" "$cfg"
          grep -n "wwwroot\|sslproxy" "$cfg"
          [ "$(grep -c "^\$CFG->wwwroot = '$url';" "$cfg")" = "1" ] \
            || { echo "::error::config.php does not name the tunnel as wwwroot"; exit 1; }
          php "$GITHUB_WORKSPACE/moodle/admin/cli/purge_caches.php"

          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/login/index.php" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "Through the tunnel: HTTP $code"
          [ "$code" = "200" ] || { tail -40 "$RUNNER_TEMP/moodle-server.log"; exit 1; }

          # What the Windows job needs, and nothing else: the participant and the activity from the
          # seed, and the tunnel as the one and only address of the site.
          mkdir -p handoff
          {
            grep -E '^A11Y_(USER|PASSWORD|ACTIVITY_URL)=' "$RUNNER_TEMP/seed.env"
            echo "A11Y_BASE_URL=$url"
          } > handoff/site.env
          [ "$(grep -c '^A11Y_' handoff/site.env)" = "4" ] \
            || { echo "::error::handoff/site.env must name exactly four A11Y_ values"; exit 1; }
          sed 's/^A11Y_PASSWORD=.*/A11Y_PASSWORD=***/' handoff/site.env

      - name: Hand the site to the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: nvda-site
          path: handoff/site.env
          retention-days: 1

      - name: Stay up until NVDA is done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows job uploads "nvda-done" when it has finished, whatever the outcome.
          for _ in $(seq 1 280); do
            curl -s -o /dev/null --max-time 10 http://127.0.0.1:8000/login/index.php \
              || echo "::warning::the local server stopped answering"
            done=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name=="nvda-done") | .name' 2>/dev/null || true)
            if [ "$done" = "nvda-done" ]; then
              echo "NVDA finished; closing the site."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::NVDA did not finish in time; closing the site anyway."

      - name: Server and tunnel logs
        if: always()
        run: |
          tail -80 "$RUNNER_TEMP/moodle-server.log" || true
          tail -40 "$RUNNER_TEMP/cloudflared.log" || true

  nvda:
    name: NVDA on Windows
    # Named, not "latest": Guidepup lists the Windows versions it supports.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    env:
      # Inputs reach the scripts through the environment only, never by interpolating ${{ }} into a
      # run block.
      TEST_GREP: ${{ inputs.grep || '' }}

    steps:
      - name: Prepare
        run: |
          echo "EXPORT_DIR=$RUNNER_TEMP/a11y-export" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/a11y-export"

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Guidepup comes in three parts that have to fit: the library the tests use, the setup tool
      # that prepares Windows, and the NVDA build that tool downloads FOR that library. Library
      # 0.33.0, integration 0.19.1 (pinned in package.json) and setup 0.24.1 are what Guidepup's own
      # Playwright project runs together. With a newer library the setup tool installs an NVDA the
      # integration does not find ("NVDA not installed").
      - name: Prepare Windows for screen reader automation
        run: npx -y @guidepup/setup@0.24.1 setup --ci

      - name: Install the suite
        working-directory: plugin/tests/a11y/screenreader
        run: |
          # npm ci, not npm install: it fails loudly when the lockfile is missing rather than
          # resolving whatever is current that day.
          npm ci --no-audit --no-fund
          npx playwright install chromium

      # After npm ci and in the suite's directory: the tool reads the installed library to decide
      # which NVDA build it needs.
      - name: Install NVDA for the installed Guidepup
        working-directory: plugin/tests/a11y/screenreader
        run: |
          npx -y @guidepup/setup@0.24.1 install nvda
          # Ask the library whether it finds what was just installed - here, in one line, rather
          # than as "NVDA not installed" in every test.
          node -e "
            let check;
            try { check = require('@guidepup/guidepup/lib/windows/NVDA/isNVDAInstalled'); }
            catch (e) { console.log('::notice::could not ask Guidepup about NVDA: ' + e.message); process.exit(0); }
            if (!check.isNVDAInstalled()) {
              console.log('::error::Guidepup ' + require('@guidepup/guidepup/package.json').version
                + ' does not find the NVDA the setup tool installed');
              process.exit(1);
            }
            console.log('Guidepup finds NVDA.');
          "

      - name: Wait for the test site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 160); do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name=="nvda-site") | .id' 2>/dev/null || true)
            if [ -n "$id" ]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > site.zip
              unzip -o -q site.zip -d handoff
              password=$(sed -n 's/^A11Y_PASSWORD=//p' handoff/site.env)
              [ -n "$password" ] && echo "::add-mask::$password"
              cat handoff/site.env >> "$GITHUB_ENV"
              sed 's/^A11Y_PASSWORD=.*/A11Y_PASSWORD=***/' handoff/site.env
              exit 0
            fi
            sleep 15
          done
          echo "::error::The test site never came up - see the job \"site\"."; exit 1

      # Fail here, with a sentence, if this runner cannot reach the site - not once per test with a
      # connection error.
      - name: Check the site from this runner
        run: |
          case "$A11Y_BASE_URL" in
            https://*.trycloudflare.com) ;;
            *) echo "::error::A11Y_BASE_URL is '$A11Y_BASE_URL', not the tunnel"; exit 1 ;;
          esac
          code=000
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "$A11Y_BASE_URL/login/index.php" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "Through the tunnel, from Windows: HTTP $code"
          [ "$code" = "200" ] \
            || { echo "::error::the test site answers HTTP $code through $A11Y_BASE_URL"; exit 1; }

      - name: Run the screen reader suite
        working-directory: plugin/tests/a11y/screenreader
        run: |
          set -o pipefail
          A11Y_EXPORT_DIR="$EXPORT_DIR" npx playwright test \
            ${TEST_GREP:+--grep "$TEST_GREP" --pass-with-no-tests} 2>&1 \
            | tee "$EXPORT_DIR/run.log"

      - name: Summarise the results
        if: always()
        run: |
          summary="$EXPORT_DIR/summary.md"
          {
            echo "# Screen reader results (NVDA)"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Site | built in this run, reached through ${A11Y_BASE_URL:-?} |"
            echo "| Started by | $GITHUB_ACTOR |"
            echo "| Title filter | ${TEST_GREP:-none} |"
            echo
            node "plugin/tests/a11y/screenreader/support/summarize-results.mjs" "NVDA" "$EXPORT_DIR/results.json"
            echo "What NVDA said is in \`transcripts/*.txt\` and attached to every test in the" \
              "HTML report (\`nvda-spoken-phrases.txt\`); read that first. The videos show the" \
              "same run from the outside."
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      # One artefact, always: passed, failed or cancelled.
      - name: Upload report, videos and transcripts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenreader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a11y-export
          retention-days: ${{ inputs.retention_days || 30 }}
          if-no-files-found: warn

      - name: Tell the site job it can stop
        if: always()
        run: mkdir -p done && echo finished > done/done.txt

      - name: Signal completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-done
          path: done/done.txt
          retention-days: 1

      - name: What a person still has to say
        if: always()
        run: |
          echo "Read transcripts/*.txt in the artefact and answer, with the date,"
          echo "the browser and the NVDA version:"
          echo "  [ ] is what NVDA says understandable, not merely present?"
          echo "  [ ] does the order of announcements match the order of the task?"
          echo "  [ ] is anything read out twice, or read when it should be silent?"
