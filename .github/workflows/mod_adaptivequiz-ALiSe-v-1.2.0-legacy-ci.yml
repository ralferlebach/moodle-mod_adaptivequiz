name: CI

# mod_adaptivequiz, Zweig ALiSe-v-1.2.0-legacy: Moodle 4.5 (LTS), PHP 8.2 bis 8.3. Keine Zelle mit PHP 8.1
# oder aelter (wie local_catquiz #156 und Adapter #10); version.php bleibt unveraendert.
#
# Blockierend ist, was dieser Zweig heute sauber besteht: PHP-Syntax, Plugin-Validierung,
# Upgrade-Savepoints und PHPUnit.
#
# Beratend (continue-on-error) laufen Code-Style, PHPDoc, Mustache, Grunt und Behat. Der
# Legacy-Zweig traegt Stil-Altlasten aus der Zeit vor der Uebernahme (Stand 2026-10-09:
# rund 1600 phpcs-Befunde in 106 Dateien, ueberwiegend array() statt [] und Einrueckung;
# phpcbf behebt etwa 1350 davon automatisch). Neuer Code wird lokal sauber gehalten. Sobald
# die Altlasten bereinigt sind, wird der jeweilige Schritt durch Entfernen von
# continue-on-error blockierend.
#
# Die Logs jedes Schritts landen in ci-logs/ und werden als ZIP-Artefakt angeboten.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.moodle-branch }} · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=3

      mariadb:
        image: mirror.gcr.io/library/mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mariadb' }

    steps:
      - name: Plugin auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Log-Verzeichnis anlegen
        run: mkdir -p ci-logs

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap, intl, pcntl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Composer-Downloads cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # Der Host braucht keine weiteren Plugins: CAT-Modelle sind Subplugins in eigenen
      # Repositories und fuer die Tests dieses Zweigs nicht noetig.
      - name: Moodle installieren
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP-Syntax
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint 2>&1 | tee ci-logs/phplint.log

      - name: Plugin-Validierung
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log

      - name: Upgrade-Savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log

      - name: PHPUnit
        if: ${{ always() }}
        env:
          # The concurrency tests (pcntl) fail instead of being skipped: a skip is no green (audit 18.10.).
          CATQUIZ_REQUIRE_CONCURRENCY: '1'
        # Re-audit 19.11.2026 (CI P0): the call moodle-plugin-ci makes - vendor/bin/phpunit with the testsuite of the
        # component, from the Moodle root - plus a JUnit log, which the evidence step below reads.
        run: |
          set -o pipefail
          cd moodle
          vendor/bin/phpunit --testsuite mod_adaptivequiz_testsuite --testdox --fail-on-warning \
            --log-junit "$GITHUB_WORKSPACE/ci-logs/junit.xml" 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/phpunit.log"

      # Re-audit 19.11.2026 (CI P0): which commits of engine, host and adapter ran together, on which Moodle, PHP
      # and database, how many tests and assertions, what was skipped - and the tests the issues name ran, passed
      # and were not skipped (the job fails otherwise). Also in the job summary.
      - name: Evidence (commits, versions, tests)
        if: ${{ always() }}
        env:
          CI_EVIDENCE_SELF: mod_adaptivequiz
        run: >-
          python3 plugin/.github/scripts/ci_evidence.py
          --title "PHPUnit / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
          --moodle moodle --db ${{ matrix.database }}
          --component mod_adaptivequiz=plugin
          --junit ci-logs/junit.xml --required plugin/.github/ci-required-tests.txt
          --out ci-logs/evidence

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-phpunit-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/evidence
            ci-logs/junit.xml
          retention-days: 90
          if-no-files-found: warn

      # Beratend - siehe Kopf. PSR1.Classes.ClassDeclaration ist ausgenommen:
      # mod_adaptivequiz_csv_renderer muss laut Moodles renderer_factory in renderer.php stehen.
      - name: Code-Style (beratend)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -o pipefail
          moodle-plugin-ci phpcs --max-warnings 0 \
            --exclude=PSR1.Classes.ClassDeclaration,moodle.Commenting.TodoComment 2>&1 | tee ci-logs/phpcs.log

      - name: PHPDoc (beratend)
        if: ${{ always() }}
        continue-on-error: true
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log

      - name: Mustache-Templates (beratend)
        if: ${{ always() }}
        continue-on-error: true
        run: set -o pipefail; moodle-plugin-ci mustache 2>&1 | tee ci-logs/mustache.log

      # moodle-plugin-ci grunt copies the plugin to a backup and afterwards back over the plugin (override). git keeps
      # its pack files read-only, so copying back failed on every .git directory inside the plugin (run of 23.11.2026,
      # moodle-plugin-ci 4.5.12: "Failed to copy ... .git/objects/pack/... Permission denied"). Only the .git
      # directories get write permission; the plugin's own files stay as they are.
      - name: Make the .git directories of the plugin writable for grunt
        if: ${{ always() }}
        run: |
          MOODLE="${MOODLE_DIR:-$(pwd)/moodle}"
          for d in "$MOODLE/public/mod/adaptivequiz" "$MOODLE/mod/adaptivequiz"; do
            if [ -d "$d" ]; then find "$d" -name .git -type d -prune -exec chmod -R u+w {} +; fi
          done

      - name: Grunt (beratend)
        if: ${{ always() }}
        continue-on-error: true
        run: set -o pipefail; moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee ci-logs/grunt.log

      # Docker Hub begrenzt anonyme Pulls (toomanyrequests). moodle-plugin-ci startet Selenium
      # per docker run und holt das Image sonst von Docker Hub; liegt es lokal vor, wird nicht
      # gezogen. Deshalb zuerst ueber den Google-Mirror, erst danach Docker Hub, mit Wiederholung.
      - name: Selenium-Image vorladen (Docker-Hub-Ratenlimit)
        if: ${{ always() }}
        run: |
          for src in mirror.gcr.io/selenium/standalone-chrome:4 selenium/standalone-chrome:4; do
            for attempt in 1 2 3; do
              if docker pull "$src"; then
                docker tag "$src" selenium/standalone-chrome:4
                exit 0
              fi
              sleep $((attempt * 15))
            done
          done
          echo "::warning::Selenium-Image konnte nicht vorab geladen werden."

      - name: Behat (beratend)
        if: ${{ always() }}
        continue-on-error: true
        env:
          # local_catquiz #176: every scenario of the run records itself here (tests/behat/behat_mod_adaptivequiz_evidence.php).
          ADAPTIVEQUIZ_BEHAT_EXECUTED: ${{ github.workspace }}/ci-logs/behat-executed.jsonl
        run: set -o pipefail; moodle-plugin-ci behat --profile chrome 2>&1 | tee ci-logs/behat.log

      # local_catquiz #176: the evidence must fail for a required feature the run did not execute (RED/GREEN self-test).
      - name: Selbsttest der CI-Evidenz
        if: ${{ always() }}
        run: python3 -B plugin/.github/scripts/ci_evidence_selftest.py

      # Re-audit 19.11.2026 (CI P0): which commits of engine, host and adapter ran together, on which Moodle, PHP
      # and database, how many tests and assertions, what was skipped - and the tests the issues name ran, passed
      # and were not skipped (the job fails otherwise). Also in the job summary.
      - name: Evidence (commits, versions, Behat)
        if: ${{ always() }}
        env:
          CI_EVIDENCE_SELF: mod_adaptivequiz
        run: >-
          python3 plugin/.github/scripts/ci_evidence.py
          --title "Behat / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
          --moodle moodle --db ${{ matrix.database }}
          --component mod_adaptivequiz=plugin
          --behat-log ci-logs/behat.log --required-features plugin/.github/ci-required-features.txt
          --features-dir plugin/tests/behat --tag @mod_adaptivequiz
          --behat-executed ci-logs/behat-executed.jsonl
          --out ci-logs/evidence-behat

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-behat-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/evidence-behat
            ci-logs/behat.log
            ci-logs/behat-executed.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Fehlerzusammenfassung
        if: ${{ always() }}
        run: |
          {
            echo "job:    ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
            echo "status: ${{ job.status }}"
            echo "commit: ${{ github.sha }}"
            echo "ref:    ${{ github.ref }}"
            echo ""
            echo "Logs (ein nicht leeres *.log eines fehlgeschlagenen Schritts enthaelt den Fehler):"
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Logs hochladen (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Behat-Screenshots sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: |
            moodledata_behat_faildump/**
            moodledata/behat_faildump/**
          if-no-files-found: ignore
          retention-days: 14
